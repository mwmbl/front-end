name: 'test'

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Cloning repo
        uses: actions/checkout@v4

      # Reads the version from `packageManager` in package.json, so the lockfile
      # is always resolved by the bun the repo is pinned to.
      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: 'package.json'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `vitest.config.ts` is standalone and plugin-free, so the unit tests need
      # neither `svelte-kit sync` nor a build to have run first.
      - name: Run tests
        run: bun run test
